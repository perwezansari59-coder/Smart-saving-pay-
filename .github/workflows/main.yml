name: Build Smart Saving Pay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          rm -rf source
          mkdir source
          unzip -q "smart-saving-pay (1).zip" -d source

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find source -type f -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Saving-Pay-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
