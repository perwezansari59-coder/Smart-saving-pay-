name: Build Smart Saving Pay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          rm -rf source
          mkdir -p source
          unzip -q "smart-saving-pay (1).zip" -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
          validate-wrappers: false

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          mkdir -p "$PROJECT_DIR/app"
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/app/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK file not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/SmartSavingPay.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSavingPay-APK
          path: SmartSavingPay.apk
